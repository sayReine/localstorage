<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>To-Do App</h1>
    
    <form id="task-form">
      <input type="text" id="task-name" placeholder="Task Name" required />
      <input type="text" id="task-type" placeholder="Task Type (Work, Personal, etc.)" required />
      <textarea id="task-desc" placeholder="Task Description" required></textarea>
      <input type="color" id="task-bg" value="#f2f2f2" />
      <button type="submit">Save Task</button>
    </form>

    <button id="clear-all">Clear All Tasks</button>

    <div id="task-list" class="task-list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
